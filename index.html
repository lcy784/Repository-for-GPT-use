<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>天宫 · 云上行旅</title>
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="三维场景"></div>
      <header class="masthead">
        <p class="eyebrow">云上行旅 · 江南入天宫</p>
        <h1>天宫</h1>
        <p class="description">一川烟水，飞入云上天阙。</p>
      </header>
      <section id="notice" role="status" aria-live="polite">正在准备三维空间…</section>
      <aside id="route" aria-label="行旅路线"><p>江南水巷 → 穿云 → 殿前 → 入殿 → 屋顶</p><p id="journey" hidden></p></aside>
      <nav class="controls" aria-label="预览操作">
        <button id="camera" type="button" disabled>切换观察位置</button>
        <button id="restart" type="button">重新载入</button>
        <button id="stop" type="button" disabled>结束预览</button>
      </nav>
      <details class="diagnostics"><summary>运行信息</summary><pre id="metrics"></pre></details>
      <footer>点击场景 · WASD 移动 · F 飞行 · 空格 / Ctrl 升降 · V 切换视角 · 拖动转向</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
