<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>天宫 · 云上行旅</title>
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="三维场景"></div>
      <header class="masthead">
        <p class="eyebrow">云上行旅 · 巨殿飞行</p>
        <h1>天宫</h1>
        <p class="description">长阶入云，仰见天阙。</p>
      </header>
      <section id="notice" role="status" aria-live="polite">正在准备三维空间…</section>
      <nav class="controls" aria-label="预览操作">
        <button id="camera" type="button" disabled>切换观察位置</button>
        <button id="restart" type="button">重新载入</button>
        <button id="stop" type="button" disabled>结束预览</button>
      </nav>
      <details class="diagnostics"><summary>运行信息</summary><pre id="metrics"></pre></details>
      <footer>点击场景 · WASD / 方向键移动 · F 起停飞行 · 空格上升 / Ctrl 下降 · 拖动转向</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
